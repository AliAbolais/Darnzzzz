<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Love Quest 💍 Qoobee & Pengu</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800;900&family=Sacramento&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React 18 & ReactDOM from Cloudflare CDN (Fastest & Most Reliable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <!-- Custom Clean Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Core Helper: React Element Builder (Zero Dependencies, Zero CORS Issues on file://) -->
    <script>
        window.h = function (type, props, ...children) {
            const flattened = children.flat(Infinity).filter(c => c !== null && c !== undefined && c !== false);
            return React.createElement(type, props || null, ...flattened);
        };
    </script>
</head>

<body
    class="bg-gradient-to-br from-pink-50 via-rose-50/40 to-purple-50 min-h-screen text-gray-800 antialiased selection:bg-rose-100">

    <!-- Ambient Floating Hearts Canvas -->
    <canvas id="bg-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- React Mount Point with Graceful Fallback -->
    <div id="root">
        <div class="flex items-center justify-center min-h-[60vh] text-center p-6">
            <div class="bg-white/80 backdrop-blur-md p-6 rounded-2xl shadow-sm border border-rose-100 max-w-sm">
                <span class="text-4xl animate-bounce block mb-2">💖</span>
                <h2 class="text-base font-black text-rose-600">Loading Love Quest...</h2>
                <p class="text-xs text-gray-400 mt-1">Preparing sweet memories for your girl...</p>
            </div>
        </div>
    </div>

    <!-- Audio Synthesis Manager -->
    <script src="audio.js"></script>

    <!-- Separated React Components -->
    <script src="components/trials.js"></script>
    <script src="components/modals.js"></script>

    <!-- Root React Application Logic -->
    <script src="app.js"></script>
</body>

</html>
